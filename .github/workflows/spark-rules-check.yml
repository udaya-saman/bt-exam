name: Spark Firestore rules check
on:
  push:
    branches: [feature/firebase-spark-leaderboard]
  pull_request:
    branches: [main]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.2
      - name: Start Firestore emulator and compile rules
        run: firebase emulators:exec --only firestore --project demo-bt-exam "node -e \"console.log('Firestore rules loaded')\""
