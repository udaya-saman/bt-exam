name: Pizza Arena regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify question bank, scoring, account settings and UI contracts
        run: |
          node tests/arena-v40.test.cjs
          node tests/assessment-bank.test.cjs
          node tests/two-screen.test.cjs
