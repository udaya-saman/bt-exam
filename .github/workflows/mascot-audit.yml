name: Mascot artwork audit
on:
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Inspect the existing mascot masters
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import base64,io
          paths=sorted(Path('images/mascot').glob('*.png'))+[Path('images/arena/mascot-avatar.png'),Path('images/arena/mascot-champion.png')]
          sheet=Image.new('RGB',(720,((len(paths)+3)//4)*188),(240,237,230))
          d=ImageDraw.Draw(sheet)
          for i,path in enumerate(paths):
              im=Image.open(path).convert('RGBA')
              print(path.name,im.size,im.getchannel('A').getextrema(),flush=True)
              im.thumbnail((164,154))
              x=(i%4)*180;y=(i//4)*188
              sheet.paste(im,(x+(180-im.width)//2,y+2),im)
              name=path.name.replace('pizza-','').replace('.png','')
              d.text((x+4,y+157),name[:24],fill='black')
          buf=io.BytesIO()
          sheet.save(buf,'JPEG',quality=79)
          enc=base64.b64encode(buf.getvalue()).decode()
          for pos in range(0,len(enc),3000): print('MASCOT_AUDIT:'+enc[pos:pos+3000])
          PY
