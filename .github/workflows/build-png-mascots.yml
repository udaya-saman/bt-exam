name: Build sharp transparent PNG mascots
on:
  push:
    branches: [feature/clear-messages-sharp-png-grid-v35]
    paths:
      - scripts/render_mascot_pngs.py
      - images/mascot/*.svg
      - images/default-avatar.svg
      - .github/workflows/build-png-mascots.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG renderer
        run: python -m pip install "CairoSVG==2.7.1" "Pillow==11.1.0"
      - name: Render transparent PNG assets
        run: python scripts/render_mascot_pngs.py
      - name: Commit generated PNGs to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/mascot/*.png images/default-avatar.png
          git diff --cached --quiet || git commit -m "Build sharp transparent PNG mascots for v3.5"
          git push origin HEAD:feature/clear-messages-sharp-png-grid-v35
