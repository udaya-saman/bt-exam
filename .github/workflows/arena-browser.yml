name: Pizza Arena mobile browser checks
on:
  push:
    branches: [feature/pizza-arena-two-screen-v36]
  pull_request:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Check small screens and player card
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          npx playwright test tests/arena-browser.spec.cjs --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pizza-arena-mobile-checks
          path: tests/screenshot-*.png
          retention-days: 7
