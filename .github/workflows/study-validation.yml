name: Study curriculum validation
on:
  push:
    branches:
      - feature/study-lessons-source-import-20261123
      - main
  pull_request:
    paths:
      - 'study/**'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'js/bt-spark.js'
      - '.github/workflows/study-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check curriculum and browser script syntax
        run: |
          node tests/study-curriculum.test.cjs
          node --check study/lesson-player.js
          node --check js/bt-spark.js
          node --check sw.js
